[package]
name = "impossible-server"
description = "Impossible Embedding server assembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
e2e-fixture = ["impossible-models/e2e-fixture"]

[[bin]]
name = "impossible-embedding"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
impossible-embedding-core = { version = "=0.1.0", path = "../impossible-embedding-core" }
impossible-embedding-onnx = { version = "=0.1.0", path = "../impossible-embedding-onnx" }
impossible-models = { version = "=0.1.0", path = "../impossible-models" }
impossible-protocol = { version = "=0.1.0", path = "../impossible-protocol" }
impossible-server-core = { version = "=0.1.0", path = "../impossible-server-core" }
prost.workspace = true
prost-types.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }
tonic-health.workspace = true
tonic-reflection.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
anyhow.workspace = true
sha2 = "=0.10.9"
tempfile = "=3.23.0"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
