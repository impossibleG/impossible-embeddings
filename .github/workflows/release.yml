name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Require tag and package version agreement
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "release tag must be vMAJOR.MINOR.PATCH"
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $versions = @($metadata.packages | Select-Object -ExpandProperty version -Unique)
          if ($versions.Count -ne 1 -or $env:GITHUB_REF_NAME -cne "v$($versions[0])") {
            throw "release tag does not match the workspace package version"
          }
      - name: Locked quality gates
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo doc --locked --workspace --no-deps
      - name: Privacy and notice gates
        shell: pwsh
        run: |
          ./scripts/privacy-scan.ps1
          ./scripts/generate-third-party-notices.ps1 -Check
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
      - name: Rust advisory scan
        run: |
          cargo install cargo-audit --locked --version 0.21.2
          cargo audit --ignore RUSTSEC-2024-0436
      - name: Build hardened container
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            --tag impossible-embedding:release-test .
          docker volume create impossible-embedding-release-test >/dev/null
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount type=volume,source=impossible-embedding-release-test,target=/var/lib/impossible-embedding \
            impossible-embedding:release-test --version
          docker volume rm impossible-embedding-release-test >/dev/null

  native:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: bash scripts/package-release.sh x86_64-unknown-linux-gnu dist
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: pwsh -NoProfile -File scripts/package-release.ps1 -Target x86_64-pc-windows-msvc -OutputDirectory dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.1
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: release-${{ matrix.target }}
      - name: Set reproducible source timestamp
        shell: pwsh
        run: |
          "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native archive
        run: ${{ matrix.package }}
      - name: Smoke archive and HTTP process
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } | Select-Object -First 1
          if (-not $archive) { throw "release archive was not produced" }
          ./scripts/package-smoke.ps1 -Archive $archive.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM and unified checksums
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          ./scripts/generate-sbom.ps1 -OutputPath "dist/impossible-embedding-$env:GITHUB_REF_NAME.spdx.json"
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz|spdx\.json)$' } | Sort-Object Name
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($asset.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $PWD "dist/SHA256SUMS"), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Attest build provenance with keyless Sigstore identity
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest dependency SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
          sbom-path: dist/impossible-embedding-${{ github.ref_name }}.spdx.json
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Impossible Embedding $GITHUB_REF_NAME" \
            --generate-notes
