[workspace]
members = [
    "crates/impossible-embedding-core",
    "crates/impossible-embedding-onnx",
    "crates/impossible-protocol",
    "crates/impossible-server-core",
    "crates/impossible-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/impossible-g/impossible-embedding"

[workspace.dependencies]
anyhow = "1.0.100"
prost = "0.14.1"
thiserror = "2.0.17"
tonic = { version = "0.14.2", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
