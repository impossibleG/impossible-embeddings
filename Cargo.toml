[workspace]
members = [
    "crates/impossible-embedding-core",
    "crates/impossible-embedding-onnx",
    "crates/impossible-models",
    "crates/impossible-protocol",
    "crates/impossible-server-core",
    "crates/impossible-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/impossibleG/impossible-embedding"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "=0.8.6", features = ["http1", "json", "tokio"] }
clap = { version = "=4.5.50", features = ["derive", "env"] }
http = "=1.3.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.7.0", features = ["http1", "server"] }
prost = "=0.14.4"
prost-types = "=0.14.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = "=1.48.0"
tonic = { version = "=0.14.2", default-features = false, features = ["codegen"] }
tonic-build = "=0.14.2"
tonic-health = "=0.14.2"
tonic-prost = "=0.14.2"
tonic-reflection = "=0.14.2"
tower = { version = "=0.5.2", features = ["limit", "timeout", "util"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
