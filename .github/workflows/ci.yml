name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@077fee5b0788f1a772d4c6ce2814159cd1d6632b # 1.85.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Real-binary end-to-end
        run: cargo test --locked --package impossible-server --features e2e-fixture --test binary_e2e -- --test-threads=1
      - name: Privacy scan
        shell: pwsh
        run: ./scripts/privacy-scan.ps1
      - name: Third-party notices
        shell: pwsh
        run: ./scripts/generate-third-party-notices.ps1 -Check
      - name: Release asset policy
        shell: pwsh
        run: ./scripts/validate-release-assets.ps1

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
