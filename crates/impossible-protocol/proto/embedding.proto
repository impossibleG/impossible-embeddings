syntax = "proto3";

package impossible.embedding.v1;

// Stable application error codes. Numeric values and meanings are part of the v1 wire contract.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_MODEL_UNAVAILABLE = 2;
  ERROR_CODE_QUEUE_FULL = 3;
  ERROR_CODE_CANCELLED = 4;
  ERROR_CODE_DEADLINE_EXCEEDED = 5;
  ERROR_CODE_INFERENCE_FAILED = 6;
  ERROR_CODE_INTERNAL = 7;
}

// Stable retry guidance independent of the gRPC status code.
enum Retryability {
  RETRYABILITY_UNSPECIFIED = 0;
  RETRYABILITY_NEVER = 1;
  RETRYABILITY_RETRYABLE = 2;
  RETRYABILITY_UNKNOWN = 3;
}

// Privacy-safe structured detail attached to failed gRPC requests.
//
// The serialized message must come from the core public error catalog. Native runtime messages,
// filesystem paths, request text, and diagnostic error chains must never populate this message.
message PublicErrorDetail {
  ErrorCode code = 1;
  Retryability retryability = 2;
  string message = 3;
}

// Minimal domain contract used to validate reproducible code generation.
service EmbeddingService {
  rpc Embed(EmbedRequest) returns (EmbedResponse);
}

message EmbedRequest {
  // A user-facing alias or canonical model id. The response always reports the
  // immutable identity that was actually used.
  string model = 1;
  repeated string input = 2;
  EmbeddingTask task = 3;
  Truncation truncation = 4;
  optional uint32 dimensions = 5;
  optional bool normalize = 6;
}

message EmbedResponse {
  repeated DenseVector embeddings = 1;
  ResolvedModelIdentity model = 2;
  TokenUsage usage = 3;
}

// Semantic purpose of the input. Unspecified maps to the document default.
enum EmbeddingTask {
  EMBEDDING_TASK_UNSPECIFIED = 0;
  EMBEDDING_TASK_QUERY = 1;
  EMBEDDING_TASK_DOCUMENT = 2;
}

// Explicit behavior when tokenization exceeds the model's sequence limit.
enum Truncation {
  TRUNCATION_UNSPECIFIED = 0;
  TRUNCATION_REJECT = 1;
  TRUNCATION_TRUNCATE = 2;
}

// Exact post-prefix, post-truncation tokenizer usage for a completed request.
message TokenUsage {
  uint64 prompt_tokens = 1;
  uint64 total_tokens = 2;
  repeated uint64 input_tokens = 3;
}

// The immutable model identity used for inference. Clients should persist this
// value, rather than the requested alias, when reproducibility matters.
message ResolvedModelIdentity {
  string canonical_id = 1;
  string revision = 2;
  string runtime = 3;
  string artifact_fingerprint = 4;
  string semantic_fingerprint = 5;
}

message DenseVector {
  repeated float values = 1;
}
